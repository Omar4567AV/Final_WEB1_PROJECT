name: CI → Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one deployment per ref at a time; cancel in-flight runs on new pushes.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Quality gates ──────────────────────────────────────────────────
  quality:
    name: Lint & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type-check
        run: npx tsc --noEmit

  # ── Job 2: Build & Deploy (main branch only) ──────────────────────────────
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: quality
    # Only deploy on direct pushes to main, not on pull-request previews
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # next-on-pages transforms the Next.js App Router output into a
      # Cloudflare Pages / Workers format. Install it if not in package.json yet.
      - name: Install @cloudflare/next-on-pages adapter
        run: npm install --save-dev @cloudflare/next-on-pages vercel

      - name: Build for Cloudflare Pages
        run: npx @cloudflare/next-on-pages
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # next-on-pages writes the deployable bundle here
          command: pages deploy .vercel/output/static --project-name=edumanage-next --commit-dirty=true

  # ── Job 3: Pull-request preview deploy ───────────────────────────────────
  preview:
    name: Preview Deploy (PR)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install @cloudflare/next-on-pages adapter
        run: npm install --save-dev @cloudflare/next-on-pages vercel

      - name: Build for Cloudflare Pages
        run: npx @cloudflare/next-on-pages
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          NODE_ENV: production

      - name: Deploy preview branch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy .vercel/output/static
            --project-name=edumanage-next
            --branch=pr-${{ github.event.pull_request.number }}
            --commit-dirty=true
